name: sync-channels

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force push even when nothing changed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-channels
  cancel-in-progress: false

env:
  CODEBERG_HOST: codeberg.org
  CODEBERG_REPO: ${{ vars.CODEBERG_REPO || 'tekintian/sublime_text-channels' }}
  TZ: Asia/Shanghai

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: codeberg-mirror
    steps:
      - name: Checkout mirror repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve target repository
        run: |
          repo="${CODEBERG_REPO}"
          repo="${repo#https://}"
          repo="${repo#http://}"
          repo="${repo#ssh://}"
          repo="${repo#*@}"
          repo="${repo#${CODEBERG_HOST}/}"
          repo="${repo#${CODEBERG_HOST}:}"
          repo="${repo#/}"
          repo="${repo%.git}"
          repo="${repo%/}"
          echo "CODEBERG_SLUG=${repo}" >> "$GITHUB_ENV"
          echo "target ssh://git@${CODEBERG_HOST}/${repo}.git"

      - name: Check credentials
        env:
          CODEBERG_SSH_KEY: ${{ secrets.CODEBERG_SSH_KEY }}
        run: |
          if [ -z "${CODEBERG_SSH_KEY:-}" ]; then
            echo "::error::CODEBERG_SSH_KEY is empty. Add it as an environment secret on environment 'codeberg-mirror' or as a repository secret."
            exit 1
          fi
          echo "CODEBERG_SSH_KEY is present"

      - name: Sync upstream channels and merge overrides
        run: python3 scripts/sync_channels.py

      - name: Verify generated channels
        run: |
          python3 - <<'EOF'
          import json
          for name in ("channel_v3.json", "channel_v4.json"):
              with open(name, encoding="utf-8") as fh:
                  data = json.load(fh)
              assert data["repositories"], f"{name}: repositories is empty"
              assert data["schema_version"], f"{name}: schema_version missing"
              entries = sum(len(v) for k, v in data.items() if k.endswith("_cache") for v in v.values())
              print(f"{name}: {entries} entries, {len(data['repositories'])} repositories")
          assert sum(
              len(v) for v in json.load(open("channel_v3.json", encoding="utf-8"))["packages_cache"].values()
          ) > 5000, "channel_v3.json looks truncated"
          print("verify OK")
          EOF

      - name: Commit generated channels
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channel_v3.json channel_v4.json upstream
          if git diff --cached --quiet; then
            echo "no changes, nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync upstream channels $(date -u +%Y-%m-%d)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        env:
          CODEBERG_SSH_KEY: ${{ secrets.CODEBERG_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CODEBERG_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "${CODEBERG_HOST}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 -T "git@${CODEBERG_HOST}" || true

      - name: Push to Codeberg
        if: steps.commit.outputs.changed == 'true' || inputs.force
        run: |
          git remote add codeberg "ssh://git@${CODEBERG_HOST}/${CODEBERG_SLUG}.git" 2>/dev/null \
            || git remote set-url codeberg "ssh://git@${CODEBERG_HOST}/${CODEBERG_SLUG}.git"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            git push codeberg HEAD:main --force

      - name: Summary
        if: always()
        run: |
          {
            echo "### channel mirror sync"
            echo "- upstream v3: https://packagecontrol.io/channel_v3.json"
            echo "- upstream v4: https://packagecontrol.github.io/channel/channel_v4.json"
            echo "- target: ssh://git@${CODEBERG_HOST}/${CODEBERG_SLUG}.git"
            echo "- changed: ${{ steps.commit.outputs.changed }}"
          } >> "$GITHUB_STEP_SUMMARY"